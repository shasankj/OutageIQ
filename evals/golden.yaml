- id: g24
  question: How many outages have no alarms at all?
  difficulty: hard
  category: null_case
  behavior: answer
  golden_sql: |
    SELECT COUNT(*) AS outages_without_alarms
    FROM ops.outages o
    LEFT JOIN ops.alarms a ON a.outage_id = o.outage_id
    WHERE a.alarm_id IS NULL
  relevant: {"Table ops.outages": 2, "Table ops.alarms": 2, "Join paths from an outage": 1}

- id: g25
  question: How many tickets were escalated, meaning the ticket priority is higher than its outage priority?
  difficulty: hard
  category: join
  behavior: answer
  golden_sql: |
    SELECT COUNT(*) AS escalated_tickets
    FROM ops.tickets t
    JOIN ops.outages o ON o.outage_id = t.outage_id
    WHERE (CASE t.priority WHEN 'low' THEN 1 WHEN 'medium' THEN 2 WHEN 'high' THEN 3 WHEN 'critical' THEN 4 END)
        > (CASE o.priority WHEN 'low' THEN 1 WHEN 'medium' THEN 2 WHEN 'high' THEN 3 WHEN 'critical' THEN 4 END)
  relevant: {"Table ops.tickets": 2, "Table ops.outages": 2, "Join paths from an outage": 1}

- id: g26
  question: For each network domain, what percentage of outages have no ticket? Round to one decimal.
  difficulty: hard
  category: aggregation
  behavior: answer
  golden_sql: |
    SELECT o.network_domain,
           ROUND(100.0 * COUNT(*) FILTER (WHERE NOT EXISTS (
             SELECT 1 FROM ops.tickets t WHERE t.outage_id = o.outage_id)) / COUNT(*), 1) AS pct_without_ticket
    FROM ops.outages o
    GROUP BY o.network_domain
    ORDER BY o.network_domain
  relevant: {"Table ops.outages": 2, "Table ops.tickets": 2, "Join paths from an outage": 1}

