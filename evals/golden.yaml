# Golden dataset v1: 30 questions, HELD OUT from the knowledge file (no question here appears there).
# Fields: id, question, difficulty, category, behavior (answer | not_found | clarify | refuse),
#         golden_sql (null when no query should run), relevant ({chunk section: grade}; 2 = required, 1 = helpful).
# Data is a fixed snapshot as of 2026-10-01, so dates are absolute.

- id: g01
  question: How many outages are recorded in total?
  difficulty: easy
  category: single_table
  behavior: answer
  golden_sql: |
    SELECT COUNT(*) AS outage_count FROM ops.outages
  relevant: {"Table ops.outages": 2}

- id: g02
  question: What priority does outage 500 have?
  difficulty: easy
  category: single_table
  behavior: answer
  golden_sql: |
    SELECT o.priority FROM ops.outages o WHERE o.outage_id = 500
  relevant: {"Table ops.outages": 2}

