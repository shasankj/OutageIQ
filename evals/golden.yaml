- id: g12
  question: How many unresolved tickets does Priya Shah have?
  difficulty: medium
  category: join
  behavior: answer
  golden_sql: |
    SELECT COUNT(*) AS unresolved_tickets
    FROM ops.tickets t
    JOIN ops.users u ON u.user_id = t.assigned_user_id
    WHERE u.full_name = 'Priya Shah' AND NOT t.is_resolved
  relevant: {"Table ops.tickets": 2, "Table ops.users": 2, "Join paths from an outage": 1}

- id: g13
  question: How many outages started on 14 September 2026, Eastern time?
  difficulty: medium
  category: time_range
  behavior: answer
  golden_sql: |
    SELECT COUNT(*) AS outage_count
    FROM ops.outages o
    WHERE (o.start_time AT TIME ZONE 'America/New_York') >= TIMESTAMP '2026-09-14'
      AND (o.start_time AT TIME ZONE 'America/New_York') <  TIMESTAMP '2026-09-15'
  relevant: {"Table ops.outages": 2, "1. Rules for writing SQL": 1}

- id: g14
  question: How many outages hit Central New Jersey sites in August 2026?
  difficulty: medium
  category: time_range
  behavior: answer
  golden_sql: |
    SELECT COUNT(*) AS outage_count
    FROM ops.outages o
    JOIN ops.sites s ON s.site_id = o.site_id
    WHERE s.region = 'NJ-Central'
      AND (o.start_time AT TIME ZONE 'America/New_York') >= TIMESTAMP '2026-08-01'
      AND (o.start_time AT TIME ZONE 'America/New_York') <  TIMESTAMP '2026-09-01'
  relevant: {"Table ops.outages": 2, "Table ops.sites": 2, "1. Rules for writing SQL": 1, "Join paths from an outage": 1}

- id: g15
  question: How many outages are there for each network domain?
  difficulty: medium
  category: aggregation
  behavior: answer
  golden_sql: |
    SELECT o.network_domain, COUNT(*) AS outage_count
    FROM ops.outages o
    GROUP BY o.network_domain
    ORDER BY o.network_domain
  relevant: {"Table ops.outages": 2}

- id: g16
  question: What is the average time to restore for ended Out of Service outages?
  difficulty: medium
  category: aggregation
  behavior: answer
  golden_sql: |
    SELECT AVG(o.end_time - o.start_time) AS mean_time_to_restore
    FROM ops.outages o
    WHERE o.outage_type = 'OOS' AND o.end_time IS NOT NULL
  relevant: {"Table ops.outages": 2, "2. Glossary and phrase mapping": 1}

- id: g17
  question: How many customers were impacted in total by outages that started on 14 September 2026, Eastern time?
  difficulty: medium
  category: time_range
  behavior: answer
  golden_sql: |
    SELECT COALESCE(SUM(i.customers_impacted), 0) AS customers_impacted
    FROM ops.impacted_services i
    JOIN ops.outages o ON o.outage_id = i.outage_id
    WHERE (o.start_time AT TIME ZONE 'America/New_York') >= TIMESTAMP '2026-09-14'
      AND (o.start_time AT TIME ZONE 'America/New_York') <  TIMESTAMP '2026-09-15'
  relevant: {"Table ops.impacted_services": 2, "Table ops.outages": 2, "1. Rules for writing SQL": 1}

- id: g18
  question: Which region has had the most outages?
  difficulty: medium
  category: aggregation
  behavior: answer
  golden_sql: |
    SELECT s.region, COUNT(*) AS outage_count
    FROM ops.outages o
    JOIN ops.sites s ON s.site_id = o.site_id
    GROUP BY s.region
    ORDER BY outage_count DESC, s.region
    LIMIT 1
  relevant: {"Table ops.outages": 2, "Table ops.sites": 2, "Join paths from an outage": 1}

