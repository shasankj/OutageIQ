- id: g09
  question: What was the primary root cause category of outage 1234?
  difficulty: medium
  category: join
  behavior: answer
  golden_sql: |
    SELECT rc.category
    FROM ops.outage_root_causes orc
    JOIN ops.root_causes rc ON rc.root_cause_id = orc.root_cause_id
    WHERE orc.outage_id = 1234 AND orc.is_primary
  relevant: {"Table ops.outage_root_causes": 2, "Table ops.root_causes": 2, "Join paths from an outage": 1}

