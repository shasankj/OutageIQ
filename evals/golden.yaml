    SELECT s.site_code FROM ops.outages o JOIN ops.sites s ON s.site_id = o.site_id WHERE o.outage_id = 800
  relevant: {"Table ops.outages": 2, "Table ops.sites": 2, "Join paths from an outage": 1}

